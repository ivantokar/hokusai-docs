name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build
      - run: npm run check:dist

  # The one required check, so the branch ruleset does not depend on individual job names.
  complete:
    name: CI complete
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "build=${{ needs.build.result }}"
          case "${{ needs.build.result }}" in success|skipped) ;; *) echo "not green"; exit 1 ;; esac
