version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro-ecosystem:
        patterns: ["astro", "@astrojs/*"]
      fonts:
        patterns: ["@fontsource/*"]
    commit-message:
      prefix: "chore(deps)"
